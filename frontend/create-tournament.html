<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>DemaciaHub | Create Tournament</title>

        <link rel="stylesheet" href="./css/app.css" />
        <script src="./js/create-tournament.js" defer></script>
    </head>
    <body>
        <header class="navbar">
            <nav class="nav-content" aria-label="Main navigation">
                <a href="home.html" class="logo">
                    <span class="logo-symbol">D</span>
                    <span class="logo-text">DEMACIAHUB</span>
                </a>

                <div class="nav-links">
                    <a href="tournaments.html" class="nav-link">Tournaments</a>
                    <span class="nav-link">Teams</span>
                </div>

                <div class="nav-right">
                    <a
                        href="profile.html"
                        class="profile-link"
                        aria-label="My profile"
                    >
                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.8"
                        >
                            <circle cx="12" cy="8" r="4"></circle>
                            <path d="M4 21v-2a8 8 0 0 1 16 0v2"></path>
                        </svg>
                    </a>
                </div>
            </nav>
        </header>

        <main class="page-container">
            <div class="page-heading">
                <span class="eyebrow">ORGANIZE THE COMPETITION</span>
                <h1>CREATE TOURNAMENT</h1>
            </div>

            <section class="content-card">
                <h2>Tournament Creation</h2>

                <form id="tournament-form" class="tournament-form">
                    <div class="tournament-fields">
                        <div class="form-group">
                            <label for="name">Tournament Name</label>
                            <input
                                type="text"
                                id="name"
                                placeholder="Enter tournament name"
                                required
                            />
                        </div>

                        <div class="form-group">
                            <label for="startDate">Tournament Start Date</label>
                            <input
                                type="datetime-local"
                                id="startDate"
                                required
                            />
                        </div>

                        <div class="form-group">
                            <label for="maxTeams">Number of Teams</label>
                            <input
                                type="number"
                                id="maxTeams"
                                min="2"
                                placeholder="16"
                                required
                            />
                        </div>
                    </div>

                    <div class="tournament-text-fields">
                        <div class="form-group">
                            <label for="description"
                                >Tournament Description</label
                            >
                            <textarea
                                id="description"
                                placeholder="Describe your tournament"
                                required
                            ></textarea>
                        </div>

                        <div class="form-group">
                            <label for="rules">Tournament Rules</label>
                            <textarea
                                id="rules"
                                placeholder="Enter tournament rules"
                                required
                            ></textarea>
                        </div>
                    </div>

                    <div class="tournament-actions">
                        <p
                            id="tournament-message"
                            class="form-message"
                            role="status"
                        ></p>

                        <button type="submit" class="gold-button">
                            CREATE TOURNAMENT
                        </button>
                    </div>
                </form>
            </section>
        </main>
    </body>
</html>
