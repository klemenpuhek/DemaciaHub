<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>DemaciaHub | Tournaments</title>

        <link rel="stylesheet" href="./css/app.css" />
        <script src="./js/tournaments.js" defer></script>
    </head>
    <body>
        <header class="navbar">
            <nav class="nav-content" aria-label="Main navigation">
                <a href="home.html" class="logo">
                    <span class="logo-symbol">D</span>
                    <span class="logo-text">DEMACIAHUB</span>
                </a>

                <div class="nav-links">
                    <a href="tournaments.html" class="nav-link active"
                        >Tournaments</a
                    >
                    <span class="nav-link">Teams</span>
                </div>

                <div class="nav-right">
                    <div class="search-box">
                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                        >
                            <circle cx="11" cy="11" r="7"></circle>
                            <path d="m20 20-4-4"></path>
                        </svg>

                        <input
                            type="search"
                            placeholder="Search tournaments..."
                            aria-label="Search tournaments"
                            disabled
                        />
                    </div>

                    <a
                        href="profile.html"
                        class="profile-link"
                        aria-label="My profile"
                    >
                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.8"
                        >
                            <circle cx="12" cy="8" r="4"></circle>
                            <path d="M4 21v-2a8 8 0 0 1 16 0v2"></path>
                        </svg>
                    </a>
                </div>
            </nav>
        </header>

        <main class="page-container profile-page">
            <div class="tournaments-heading">
                <div class="page-heading">
                    <span class="eyebrow">ENTER THE ARENA</span>
                    <h1>TOURNAMENTS</h1>
                </div>

                <a href="create-tournament.html" class="gold-button">
                    CREATE TOURNAMENT
                </a>
            </div>

            <section class="content-card">
                <h2>Ongoing Tournaments</h2>

                <div id="ongoing-tournaments" class="tournaments-grid"></div>
            </section>

            <section class="content-card">
                <h2>Upcoming Tournaments</h2>

                <div id="upcoming-tournaments" class="tournaments-grid"></div>
            </section>
        </main>
    </body>
</html>
